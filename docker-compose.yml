services:
  loadbalancer:
    image: nginx:alpine
    container_name: loadbalancer
    ports:
      - "80:80"              # externe poort -> Nginx LB
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    networks:
      - lbnet

  web1:
    image: nginx:alpine
    container_name: web1
    volumes:
      - ./web1/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - lbnet

  web2:
    image: nginx:alpine
    container_name: web2
    volumes:
      - ./web2/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - lbnet

networks:
  lbnet:
    driver: bridge
